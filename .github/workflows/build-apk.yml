name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # para publicar cada versión (la busca el actualizador de la app)

concurrency:
  group: compilar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # El runner de GitHub ya trae el SDK de Android (ANDROID_HOME) y Google Chrome
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Prueba automática: si el juego tira errores, le faltan archivos o intenta salir a internet, NO se publica
      - name: Probar el juego sin internet (nombre, menú, partida, pausa, reabrir)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          node tests/smoke.cjs app/src/main/assets/www capturas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-prueba
          path: capturas
          if-no-files-found: ignore
      - name: Manifiesto del contenido (va dentro de la APK)
        run: python3 .github/scripts/manifiesto.py ${{ github.run_number }} ${{ github.sha }} app/src/main/assets/contenido-base.json
      - name: Compilar
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -Pvc=${{ github.run_number }}
      - name: Preparar la publicación
        run: |
          VER=$(grep -oP "def version = '\K[^']+" app/build.gradle)
          APK=PokeSurvivor-${VER}-build-${{ github.run_number }}.apk
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          python3 .github/scripts/manifiesto.py --apk "$APK" app/src/main/assets/contenido-base.json contenido.json
          git log -1 --pretty=%B > notas.md
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "VER=$VER" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: PokeSurvivor-APK
          path: ${{ env.APK }}
      # Cada compilación de main se publica como versión: la app la encuentra y se actualiza sola
      - name: Publicar versión
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PokéSurvivor Offline ${{ env.VER }} · build ${{ github.run_number }}
          body_path: notas.md
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            ${{ env.APK }}
            contenido.json
