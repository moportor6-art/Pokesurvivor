name: Build offline Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore optional persistent test signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.POKESURVIVOR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/pokesurvivor.keystore"
            echo "POKESURVIVOR_KEYSTORE=$RUNNER_TEMP/pokesurvivor.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build signed test APK from bundled preservation
        run: bash tools/build_apk.sh
      - name: Check preserved bytes and packaged assets
        run: python3 tools/verify_bundle.py
      - name: Test offline bootstrap and local save restoration (DOM, not device rendering)
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/upload-artifact@v4
        with:
          name: Pokesurvivor-Offline-0.1.0-partial
          path: |
            build/Pokesurvivor-Offline-0.1.0-partial.apk
            build/SHA256SUMS.txt
            build/permissions.txt
            preservation/bundled-assets-sha256.json
          retention-days: 90
