name: Publish preserved partial APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-partial.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify the preserved APK checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish original signed APK as a prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag='v0.1.0-partial'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; leaving it unchanged.'
            exit 0
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Primera APK de preservación personal, versión parcial.

          Descargar el archivo .apk de Assets. Es la misma APK firmada conservada en dist/; no se recompila ni se cambia la firma para esta publicación.

          Incluye recursos locales y guardado del perfil en el dispositivo. No declara permiso de Internet. La captura contiene 1.822 archivos originales, pero faltan numerosos recursos por el límite HTTP 429 del sitio.

          Para la primera prueba, elegir Bulbasaur después del cuestionario (Elegir otro). Sus hojas de animación están incluidas. Puede haber personajes o zonas incompletos.

          Validado: compilación y firma APK, integridad de recursos, ausencia del permiso de Internet y prueba automatizada de arranque/guardado en DOM. No se ha probado todavía en un teléfono o emulador Android; no se certifica una partida completa.

          Proyecto fan sin afiliación oficial. Sprites: SpriteCollab (CC BY-NC 4.0), según el sitio original. Pokémon © Nintendo / Creatures / GAME FREAK.
          NOTES
          gh release create "$tag" \
            'dist/Pokesurvivor-Offline-0.1.0-partial.apk' \
            'dist/SHA256SUMS.txt' \
            --target "$RELEASE_COMMIT" \
            --title 'Pokesurvivor Offline 0.1.0 — parcial' \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease
